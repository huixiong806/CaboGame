[package]
name = "cabo"
version = "0.1.0"
edition = "2021"
description = "Cabo 卡牌游戏：Rust 服务端 + 无 JS 的 HTMX 网页客户端"
license = "MIT"

[lib]
name = "cabo"
path = "src/lib.rs"

[[bin]]
name = "cabo-server"
path = "src/bin/server.rs"

[[bin]]
name = "cabo-sim"
path = "src/bin/sim.rs"

[[bin]]
name = "cabo-arena"
path = "src/bin/arena.rs"

[[bin]]
name = "cabo-decide"
path = "src/bin/decide.rs"

[[bin]]
name = "cabo-eval"
path = "src/bin/eval.rs"

[[bin]]
name = "cabo-match-data"
path = "src/bin/match_data.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
